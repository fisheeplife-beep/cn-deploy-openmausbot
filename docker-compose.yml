# Thin local stack mirroring upstream root compose.yaml semantics.
# Prefer cloning upstream and `docker compose up -d --build` from the monorepo
# root if you need the full deploy/local Dockerfile build context.
#
# This file pulls the published GHCR base image and expects you to either:
#   1) clone milind-soni/OpenMausBot and use ITS compose.yaml (recommended), or
#   2) use scripts/start-docker-upstream.sh which clones a shallow copy.
#
# Kept here so readers see the ports / healthcheck / env shape without opening
# the huge upstream tree first.

name: ${COMPOSE_PROJECT_NAME:-openmausbot}

services:
  omb:
    init: true
    shm_size: 512m
    image: ${OMB_BASE_IMAGE:-ghcr.io/milind-soni/openmausbot:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${OMB_BIND_ADDRESS:-127.0.0.1}:${OMB_HTTP_PORT:-8080}:80"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_PUBLIC_URL: ${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}
      OMB_WEBHOOK_PUBLIC_URL: ${OMB_WEBHOOK_PUBLIC_URL:-${OMB_PUBLIC_URL:-http://localhost:${OMB_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('openmausbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

volumes:
  data:
    external: ${OMB_DATA_EXTERNAL:-false}
    name: ${OMB_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-openmausbot}_data}
